function showCustomerModal(){document.getElementById('modal').innerHTML=`<div class="modal"><h2>新增客户</h2><p>新增后会出现在销售 Invoice 的客户选项中。</p><div class="field-group" style="margin-bottom:11px"><span class="field-label">Company Name</span><input class="field" id="newCustomerName" placeholder="客户名称"></div><div class="field-group" style="margin-bottom:11px"><span class="field-label">Company Name2（可留空）</span><input class="field" id="newCustomerName2" placeholder="第二名称"></div><div class="field-group"><span class="field-label">Code</span><input class="field" id="newCustomerCode" placeholder="例如 300-C0001"></div><div class="modal-actions"><button class="button light" onclick="closeModal()">取消</button><button class="button primary" onclick="saveNewCustomer()">保存客户</button></div></div>`;document.getElementById('modal').classList.add('open')}
function saveNewCustomer(){let name=document.getElementById('newCustomerName').value.trim(),name2=document.getElementById('newCustomerName2').value.trim(),code=document.getElementById('newCustomerCode').value.trim();if(!name||!code){toast('请填写 Company Name 和 Code');return}if(state.customers.some(c=>c.code.toLowerCase()===code.toLowerCase())){toast('这个客户编号已存在');return}let c={id:`C${Date.now().toString(36).toUpperCase()}`,name,name2,code};state.customers.push(c);save();draftParty=page==='calc'&&mode==='sale'?c.id:draftParty;closeModal();if(page==='data')renderData();else renderCalc();toast('客户已加入 Invoice 选项')}
function renderData(){let focus=document.activeElement?.classList?.contains('search'),cursor=focus?document.activeElement.selectionStart:null;let q=window.dataSearch||'',items=state.items.filter(i=>(i.code+' '+i.name).toLowerCase().includes(q.toLowerCase()));document.getElementById('view-data').innerHTML=`${header('库存与商品','数据管理','管理 65 个鱼货品项、编号、计价单位和两种单价。单位默认设为 KG，可随时改成 UNIT。',`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="button light" onclick="showCloudBackup()">☁　云端备份</button><button class="button light" onclick="exportData()">↓　备份 Excel</button></div>`)}<div class="panel"><div class="filters"><div class="search-wrap"><input class="search" placeholder="搜索编号或英文品名…" value="${esc(q)}" oninput="window.dataSearch=this.value;renderData()"></div><span style="font-size:10px;color:var(--muted)">${items.length} / 65 个品项</span><button class="button outline small" onclick="showPriceHelp()">价格说明</button></div><div class="table-wrap"><table class="catalog-table"><thead><tr><th>Item code</th><th>Description (Item name)</th><th>单位</th><th>默认售价 / 单位</th><th>进货价 / 单位</th><th>已记录销量</th><th>状态</th></tr></thead><tbody>${items.map(i=>{let sold=state.docs.filter(d=>d.type==='sale').flatMap(d=>d.lines).filter(l=>l.code===i.code).reduce((a,l)=>a+l.qty,0);return `<tr><td><span class="code">${i.code}</span></td><td style="font-weight:600">${esc(i.name)}</td><td><select class="stock-edit" aria-label="${i.code} unit" onchange="setStockUnit('${i.code}',this.value)"><option value="KG" ${i.unit==='KG'?'selected':''}>KG</option><option value="UNIT" ${i.unit==='UNIT'?'selected':''}>UNIT</option></select></td><td><input class="stock-edit" type="number" min="0" step="0.01" value="${i.price||''}" placeholder="输入售价" onchange="setStockPrice('${i.code}',this.value,'sale')"></td><td><input class="stock-edit" type="number" min="0" step="0.01" value="${i.cost||''}" placeholder="输入进货价" onchange="setStockPrice('${i.code}',this.value,'purchase')"></td><td>${sold} ${i.unit}</td><td><button class="badge ${i.enabled?'':'purchase'}" style="border:0;cursor:pointer" onclick="toggleItem('${i.code}')">${i.enabled?'使用中':'已停用'}</button></td></tr>`}).join('')}</tbody></table></div></div><p style="font-size:10px;color:#869792;padding:0 4px;margin-top:12px">商品编号按库存表中的 Item 编号补成四位数，例如 1 → 0001、6 → 0006、23 → 0023。价格保存在当前浏览器；连接云端后会自动备份，也可下载 Excel 副本。</p>`;document.getElementById('view-data').insertAdjacentHTML('beforeend',customerPanel());if(focus){let input=document.querySelector('#view-data .search');input?.focus();if(cursor!=null)input?.setSelectionRange(cursor,cursor)}}
function setStockPrice(code,v,type='sale'){let i=state.items.find(x=>x.code===code);if(type==='purchase')i.cost=Math.max(0,Number(v)||0);else i.price=Math.max(0,Number(v)||0);save();toast(`${i.code} ${i.name} ${type==='sale'?'售价':'进货价'}已更新`)}function setStockUnit(code,unit){if(!['KG','UNIT'].includes(unit))return;let i=state.items.find(x=>x.code===code);if(!i)return;i.unit=unit;save();toast(`${i.code} ${i.name} 单位已改为 ${unit}`)}function toggleItem(code){let i=state.items.find(x=>x.code===code);i.enabled=!i.enabled;save();renderData()}function showPriceHelp(){document.getElementById('modal').innerHTML=`<div class="modal"><h2>价格怎样记住？</h2><p>每个品项的最近一次单价会按 Item code 保存在本机浏览器。销售价和进货价分开保存。你可以在这里修改两种默认价格，也能在开单时调整当前单价；调整后会更新对应类型的默认价。</p><div class="purchase-note">举例：Item code 0001 今天改为 RM 30.00 / KG，下一次选择 0001 时会自动带出 RM 30.00。以后市场价格变动时，直接编辑即可。</div><div class="modal-actions"><button class="button primary" onclick="closeModal()">知道了</button></div></div>`;document.getElementById('modal').classList.add('open')}
function exportData(){let stock=[['Item code','Description (Item name)','UOB','Sale Price (RM / Unit)','Purchase Price (RM / Unit)','Status'],...state.items.map(i=>[i.code,i.name,i.unit,i.price,i.cost,i.enabled?'Active':'Inactive'])],customers=[['Company Name','Company Name2','Code'],...state.customers.map(c=>[c.name,c.name2||'',c.code||''])],details=[['Document No','Type','Date','Customer / Supplier','Company Name2','Customer Code','Payment','No','Item code','Description','QTY','Unit','Price / Unit (RM)','Line Total (RM)'],...state.docs.flatMap(d=>d.lines.map((l,n)=>[d.id,d.type==='sale'?'Sales Invoice':'Purchase Order',d.date,d.party||'Walk-in',d.party2||'',d.partyCode||'',d.payment,n+1,l.code,l.name,l.qty,l.unit,l.price,l.qty*l.price]))];downloadXlsx(`chuan-chee-backup-${today()}.xlsx`,[{name:'Stock Items',rows:stock,headerRow:1,autoFilter:true,widths:[14,42,12,22,25,14]},{name:'Customers',rows:customers,headerRow:1,autoFilter:true,widths:[38,32,22]},{name:'Transactions',rows:details,headerRow:1,autoFilter:true,widths:[30,22,16,30,28,22,14,8,14,42,12,12,22,22]}]);toast('Excel 备份已下载')}
function exportClose(type){let docs=state.docs.filter(d=>type==='daily'?d.date===today():d.date.startsWith(today().slice(0,7))),sales=docs.filter(d=>d.type==='sale'),purch=docs.filter(d=>d.type==='purchase'),rev=sales.reduce((a,d)=>a+amount(d),0),cost=purch.reduce((a,d)=>a+amount(d),0),period=type==='daily'?today():today().slice(0,7),summary=[['CHUAN & CHEE FISHERY'],[type==='daily'?'每日结账报告':'月度结账报告'],['期间',period],['项目','金额 (RM)'],['销售收入',rev],['进货支出',cost],['收入减进货',rev-cost],['销售单量',sales.length],['进货单量',purch.length]],details=[['单据号码','类型','日期','客户 / 供应商','Company Name2','Customer Code','付款方式','单据总额 (RM)'],...docs.map(d=>[d.id,d.type==='sale'?'销售 Invoice':'进货 Purchase',d.date,d.party||'散客',d.party2||'',d.partyCode||'',d.payment,amount(d)])];downloadXlsx(`${type==='daily'?'daily-close':'monthly-close'}-${period}.xlsx`,[{name:'结账汇总',rows:summary,headerRow:4,widths:[25,28]},{name:'单据明细',rows:details,headerRow:1,autoFilter:true,widths:[30,24,16,30,30,22,16,22]}]);toast('结账 Excel 已下载')}
function renderPage(id){if(id==='home')renderHome();if(id==='calc')renderCalc();if(id==='stats')renderStats();if(id==='daily'||id==='monthly')closeView(id);if(id==='orders')renderOrders();if(id==='data')renderData()}
document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('zh-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'});nav();renderPage('home');
</script>
